name: 打包 exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name WeeklyReportUpdater
          --add-data "config.json;."
          --collect-data pptx
          main.py

      - name: 整理发布文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\WeeklyReportUpdater.exe release\
          Copy-Item config.json release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath WeeklyReportUpdater.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WeeklyReportUpdater
          path: release/

      - name: 发布 Release（打 v 开头的 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WeeklyReportUpdater.zip
